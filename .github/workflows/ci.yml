name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --component rust-src
          rustup default nightly

      - name: Install QEMU
        run: choco install qemu -y --no-progress

      - name: Add QEMU to PATH
        run: echo "C:\Program Files\qemu" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate
        run: cargo check-all

      - name: Smoke QEMU
        run: cargo smoke-qemu

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 unzip curl

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --component rust-src
          rustup default nightly

      - name: Validate
        run: cargo check-all

      - name: Smoke QEMU
        run: cargo smoke-qemu
